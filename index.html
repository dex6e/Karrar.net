<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعة الكرار - تسجيل المشتركين</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="tel"]:focus {
            border-color: #0056b3;
        }
        
        /* تنسيق قسم الصور لتكون جنب بعض */
        .images-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .image-box {
            flex: 1;
            background: #fafafa;
            border: 2px dashed #ddd;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .image-box:hover {
            border-color: #0056b3;
        }
        .image-box label {
            font-size: 12px;
            color: #666;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .image-box input[type="file"] {
            display: none;
        }
        .preview-img {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            display: none;
            margin-top: 5px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-gps {
            background-color: #17a2b8;
            color: white;
            margin-bottom: 15px;
        }
        .btn-gps:hover {
            background-color: #138496;
        }
        .btn-whatsapp {
            background-color: #28a745;
            color: white;
        }
        .btn-whatsapp:hover {
            background-color: #218838;
        }
        #locationStatus {
            font-size: 13px;
            color: #28a745;
            text-align: center;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مجموعة الكرار - تسجيل المشتركين</h2>
    
    <div class="form-group">
        <label>اسم المشترك الكامل:</label>
        <input type="text" id="subName" placeholder="أدخل اسم المشترك">
    </div>

    <div class="form-group">
        <label>عنوان IP / الباسورد:</label>
        <input type="text" id="subIp" placeholder="مثال: 192.168.1.50 / Pass">
    </div>

    <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="tel" id="subPhone" placeholder="07xxxxxxxxx">
    </div>

    <!-- زر الموقع الجغرافي -->
    <button type="button" class="btn btn-gps" onclick="getLocation()">📍 تحديد الموقع الحالي تلقائياً</button>
    <div id="locationStatus">تم تحديد الموقع بنجاح!</div>

    <!-- خانات الصور (جنب بعض) -->
    <label>صور التركيب والقطع:</label>
    <div class="images-row">
        <div class="image-box" onclick="document.getElementById('img1').click()">
            <label>صورة 1</label>
            <input type="file" id="img1" accept="image/*" onchange="previewImage(this, 'preview1')">
            <img id="preview1" class="preview-img">
        </div>
        <div class="image-box" onclick="document.getElementById('img2').click()">
            <label>صورة 2</label>
            <input type="file" id="img2" accept="image/*" onchange="previewImage(this, 'preview2')">
            <img id="preview2" class="preview-img">
        </div>
    </div>

    <!-- زر الإرسال للواتساب -->
    <button type="button" class="btn btn-whatsapp" onclick="sendToWhatsApp()">🟢 مشاركة إلى كروب الواتساب</button>
</div>

<script>
    let lat = "", lon = "";

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                lat = position.coords.latitude;
                lon = position.coords.longitude;
                document.getElementById('locationStatus').style.display = 'block';
                document.getElementById('locationStatus').innerText = "📍 تم تحديد الموقع (خط العرض: " + lat.toFixed(4) + ")";
            }, function(error) {
                alert("يرجى تفعيل خدمة الموقع (GPS) في هاتفك والسماح للمتصفح بالوصول إليه.");
            });
        } else {
            alert("المتصفح لا يدعم تحديد الموقع الجغرافي.");
        }
    }

    function previewImage(input, previewId) {
        const preview = document.getElementById(previewId);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function sendToWhatsApp() {
        let name = document.getElementById('subName').value;
        let ip = document.getElementById('subIp').value;
        let phone = document.getElementById('subPhone').value;

        if(!name) {
            alert("يرجى إدخال اسم المشترك على الأقل!");
            return;
        }

        let mapLink = (lat && lon) ? `https://www.google.com/maps?q=${lat},${lon}` : "لم يتم تحديد الموقع";

        let message = `📋 *تسجيل مشترك جديد - مجموعة الكرار*\n\n` +
                      `👤 *الاسم:* ${name}\n` +
                      `🔌 *الـ IP والرمز:* ${ip || 'غير متوفر'}\n` +
                      `📱 *الهاتف:* ${phone || 'غير متوفر'}\n` +
                      `📍 *الموقع الجغرافي:* ${mapLink}`;

        let encodedMessage = encodeURIComponent(message);
        window.open(`https://api.whatsapp.com/send?text=${encodedMessage}`, '_blank');
    }
</script>

</body>
</html>
