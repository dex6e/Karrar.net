<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مجموعة الكرار - نظام إدارة وتسجيل المشتركين</title>
    <!-- مكتبة Supabase JS الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle at top, #0d1b2a, #050914); 
            color: #ffffff; 
            padding: 20px 16px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card { 
            background: rgba(16, 26, 48, 0.95); 
            width: 100%; 
            border-radius: 24px; 
            padding: 24px 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1); 
            border: 1px solid #1f3154; 
            backdrop-filter: blur(10px);
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 20px; 
            border-bottom: 1px solid #1f3154; 
            padding-bottom: 18px; 
            position: relative;
        }

        .logo-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(56, 189, 248, 0.6);
            animation: rotateOrbit 12s linear infinite;
        }

        .orbit-ring-inner {
            position: absolute;
            width: 78%;
            height: 78%;
            border-radius: 50%;
            border: 1.5px dashed rgba(56, 189, 248, 0.35);
            animation: rotateOrbitRev 15s linear infinite;
        }

        .logo-svg {
            width: 85px;
            height: 85px;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.9));
        }

        @keyframes rotateOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotateOrbitRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        .brand-title { 
            font-size: 22px; 
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #f0f6fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .brand-sub { font-size: 12px; color: #94a3b8; font-weight: 500; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 600px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
            .full-width { grid-column: span 2; }
        }

        .form-group { text-align: right; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="tel"] { 
            width: 100%; 
            padding: 12px 14px; 
            background: #091122; 
            border: 1.5px solid #233554; 
            border-radius: 11px; 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.25s ease;
        }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        
        .btn-gps { 
            width: 100%; 
            background: linear-gradient(135deg, #0284c7, #0369a1); 
            color: #fff; 
            border: none; 
            padding: 11px; 
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 6px; 
        }

        .file-box { 
            background: #091122; 
            border: 2px dashed #233554; 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
        }
        input[type="file"] { display: none; }
        .file-label { 
            display: inline-block; 
            background: #1e293b; 
            border: 1px solid #334155;
            color: #f1f5f9; 
            padding: 10px 18px; 
            border-radius: 9px; 
            font-size: 13px; 
            cursor: pointer; 
            font-weight: 600; 
        }
        #fileCount { display: block; font-size: 12px; color: #38bdf8; margin-top: 8px; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { 
            flex: 1; 
            min-width: 140px;
            padding: 13px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 800; 
            border: none; 
            cursor: pointer; 
            text-align: center;
        }
        .btn-save { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; }
        .btn-wa { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }

        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .dash-title { font-size: 18px; color: #38bdf8; font-weight: 700; }
        
        .search-box {
            width: 100%;
            margin-bottom: 12px;
        }

        .export-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-exp { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .btn-exp:hover { background: #334155; }

        .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; border-radius: 12px; border: 1px solid #233554; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 13px; }
        th { background: #091122; color: #38bdf8; padding: 12px; font-weight: 700; border-bottom: 1px solid #233554; }
        td { padding: 12px; border-bottom: 1px solid #1f3154; color: #cbd5e1; }
        tr:hover { background: rgba(56, 189, 248, 0.05); }

        .btn-del { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }

        @media print {
            body { background: #fff; color: #000; }
            .card { background: #fff; color: #000; border: none; box-shadow: none; }
            .btn-group, .btn-gps, .file-box, .export-btns, .form-card, .search-box { display: none !important; }
            table { color: #000; border: 1px solid #ccc; }
            th { background: #eee; color: #000; }
            td { border-bottom: 1px solid #ccc; color: #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card form-card">
        <div class="header">
            <div class="logo-wrap">
                <div class="orbit-ring"></div>
                <div class="orbit-ring-inner"></div>
                <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M42 22 C46 19, 54 19, 58 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M36 16 C43 11, 57 11, 64 16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M30 10 C40 3, 60 3, 70 10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="50" cy="27" r="4.5" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
                    <path d="M47 31 L33 82 H67 L53 31 Z" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"/>
                    <path d="M43 43 L57 43 M39 56 L61 56 M36 69 L64 69" stroke="#0284c7" stroke-width="1.8"/>
                    <path d="M43 43 L61 56 M57 43 L39 56" stroke="#38bdf8" stroke-width="1.2"/>
                    <path d="M39 56 L64 69 M61 56 L36 69" stroke="#38bdf8" stroke-width="1.2"/>
                </svg>
            </div>
            <h2 class="brand-title">مجموعة الكرار</h2>
            <span class="brand-sub">بوابة تسجيل ومتابعة المشتركين</span>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>اسم المشترك الكامل:</label>
                <input type="text" id="custName" placeholder="الاسم الكامل">
            </div>

            <div class="form-group">
                <label>عنوان الآي بي (IP):</label>
                <input type="text" id="custIp" placeholder="10.20.X.X">
            </div>

            <div class="form-group">
                <label>الرمز / الباسورد:</label>
                <input type="text" id="custPass" placeholder="رمز النانو / الراوتر">
            </div>

            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="custPhone" placeholder="077XXXXXXXX">
            </div>

            <div class="form-group full-width">
                <label>الموقع الجغرافي (GPS):</label>
                <input type="text" id="custLoc" placeholder="الصق رابط الخريطة أو اضغط الزر أدناه">
                <div style="display: flex; gap: 8px; margin-top: 5px;">
                    <button type="button" class="btn-gps" onclick="getLocation()">📍 سحب تلقائي</button>
                    <button type="button" class="btn-gps" style="background: #1e293b;" onclick="openMaps()">🗺️ خرائط جوجل</button>
                </div>
            </div>

            <div class="form-group full-width">
                <label>صور القطع والتركيب (نانو / راوتر):</label>
                <div class="file-box">
                    <label class="file-label" for="custPhotos">📸 التقاط أو إرفاق صور</label>
                    <input type="file" id="custPhotos" multiple accept="image/*" onchange="updateFileCount()">
                    <span id="fileCount">لم يتم اختيار أي صورة بعد</span>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-save" onclick="saveSubscriber()">💾 حفظ في السحابة</button>
            <button type="button" class="btn btn-wa" onclick="sendToWhatsApp()">🟢 إرسال للواتساب</button>
        </div>
    </div>

    <div class="card">
        <div class="dash-header">
            <div class="dash-title">📋 قاعدة بيانات المشتركين (سحابي فقط)</div>
            <div class="export-btns">
                <button class="btn-exp" onclick="loadSubscribers()">🔄 تحديث</button>
                <button class="btn-exp" onclick="exportToWord()">📄 تصدير Word</button>
                <button class="btn-exp" onclick="window.print()">🖨️ طباعة / PDF</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن مشترك (بالاسم، الـ IP، أو الهاتف)..." onkeyup="filterSubscribers()">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم المشترك</th>
                        <th>IP</th>
                        <th>الباسورد</th>
                        <th>الهاتف</th>
                        <th>الموقع</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="subscribersTable">
                    <tr><td colspan="7" style="text-align:center; padding: 20px;">جاري تحميل البيانات من السحابة...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://ojgogddxpedpeodkybbi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qZ29nZGR4cpedpeodkybbiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODAwMzcsImV4cCI6MjEwODg1NjAzN30.xfKXw0k0f0WalHI1JsKNdwcphpgYab-l0YyAJO-FRfM';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allSubscribers = [];

window.onload = function() {
    loadSubscribers();
};

function getLocation() {
    const locField = document.getElementById('custLoc');
    if (!navigator.geolocation) { alert("المتصفح لا يدعم سحب اللوكيشن تلقائياً"); return; }
    locField.placeholder = "جاري قراءة القمر الصناعي...";
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            locField.value = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
            alert("تم تحديد الموقع بنجاح");
        },
        () => {
            alert("تعذر سحب الموقع تلقائياً.");
            locField.placeholder = "الصق رابط الخريطة هنا";
        },
        { enableHighAccuracy: true }
    );
}

function openMaps() {
    window.location.href = "https://maps.google.com";
}

function updateFileCount() {
    const files = document.getElementById('custPhotos').files;
    document.getElementById('fileCount').innerText = files.length > 0 ? `تم اختيار ${files.length} صورة` : "لم يتم اختيار أي صورة بعد";
}

// الحفظ المباشر في سحابة Supabase فقط
async function saveSubscriber() {
    const name = document.getElementById('custName').value.trim();
    const ip = document.getElementById('custIp').value.trim();
    const pass = document.getElementById('custPass').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const loc = document.getElementById('custLoc').value.trim();

    if (!name) { alert("يرجى كتابة اسم المشترك على الأقل"); return; }

    const newSub = { 
        name: name, 
        ip: ip || 'غير محدد', 
        pass: pass || 'غير محدد', 
        phone: phone || 'غير محدد', 
        loc: loc || 'غير محدد',
        date: new Date().toLocaleDateString('ar-IQ')
    };

    try {
        const { error } = await supabaseClient.from('subscribers').insert([newSub]);
        
        if (error) {
            console.error("خطأ في الرفع للسحابة:", error);
            alert("فشل الحفظ في السحابة: " + error.message);
            return;
        } else {
            alert("✓ تم حفظ المشترك في السحابة بنجاح!");
            clearForm();
            loadSubscribers();
        }
    } catch (e) {
        console.error("خطأ اتصال:", e);
        alert("تعذر الاتصال بقاعدة البيانات السحابية.");
    }
}

function clearForm() {
    document.getElementById('custName').value = '';
    document.getElementById('custIp').value = '';
    document.getElementById('custPass').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('custLoc').value = '';
    document.getElementById('custPhotos').value = '';
    document.getElementById('fileCount').innerText = "لم يتم اختيار أي صورة بعد";
}

// جلب البيانات من جدول Supabase حصراً
async function loadSubscribers() {
    const tbody = document.getElementById('subscribersTable');
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px;">جاري تحميل المشتركين من السحابة...</td></tr>';

    try {
        const { data, error } = await supabaseClient
            .from('subscribers')
            .select('*')
            .order('id', { ascending: false });
            
        if (error) {
            console.error("خطأ في جلب البيانات:", error);
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 20px; color:#ef4444;">خطأ في الاتصال بالسحابة: ${error.message}</td></tr>`;
            return;
        }

        allSubscribers = data || [];
        renderTable(allSubscribers);
    } catch (e) {
        console.error("خطأ:", e);
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px; color:#ef4444;">تعذر الاتصال بالخادم السحابي</td></tr>';
    }
}

function renderTable(list) {
    const tbody = document.getElementById('subscribersTable');
    if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px;">لا يوجد مشتركين مسجلين في السحابة حالياً</td></tr>';
        return;
    }

    tbody.innerHTML = '';
    list.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${idx + 1}</td>
            <td><b>${item.name}</b></td>
            <td><code>${item.ip}</code></td>
            <td><code>${item.pass}</code></td>
            <td>${item.phone}</td>
            <td>${item.loc && item.loc !== 'غير محدد' ? `<a href="${item.loc}" target="_blank" style="color:#38bdf8">عرض الخريطة</a>` : 'بدون'}</td>
            <td><button class="btn-del" onclick="deleteSub(${item.id})">حذف</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function filterSubscribers() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!query) {
        renderTable(allSubscribers);
        return;
    }

    const filtered = allSubscribers.filter(item => {
        return (
            (item.name && item.name.toLowerCase().includes(query)) ||
            (item.ip && item.ip.toLowerCase().includes(query)) ||
            (item.phone && item.phone.toLowerCase().includes(query))
        );
    });

    renderTable(filtered);
}

// حذف السجل من سحابة Supabase مباشرة
async function deleteSub(id) {
    if (confirm("هل أنت متأكد من حذف هذا المشترك من السحابة؟")) {
        try {
            const { error } = await supabaseClient.from('subscribers').delete().eq('id', id);
            if (error) {
                alert("فشل الحذف: " + error.message);
            } else {
                loadSubscribers();
            }
        } catch (e) {
            alert("حدث خطأ أثناء الاتصال بالسحابة للحذف.");
        }
    }
}

async function sendToWhatsApp() {
    const name = document.getElementById('custName').value.trim() || 'غير محدد';
    const ip = document.getElementById('custIp').value.trim() || 'غير محدد';
    const pass = document.getElementById('custPass').value.trim() || 'غير محدد';
    const phone = document.getElementById('custPhone').value.trim() || 'غير محدد';
    const loc = document.getElementById('custLoc').value.trim() || 'غير محدد';

    const message = 
`📌 *مشترك جديد - مجموعة الكرار*
━━━━━━━━━━━━━━━━━━
👤 *الاسم:* ${name}
🌐 *الآي بي (IP):* ${ip}
🔑 *الرمز / الباسورد:* ${pass}
📞 *الهاتف:* ${phone}
📍 *الموقع:* ${loc}
━━━━━━━━━━━━━━━━━━`;

    const fileInput = document.getElementById('custPhotos');
    const files = fileInput.files;

    if (navigator.canShare && files.length > 0 && navigator.canShare({ files: Array.from(files) })) {
        try {
            await navigator.share({ title: 'مجموعة الكرار', text: message, files: Array.from(files) });
            return;
        } catch (e) {}
    }

    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
}

function exportToWord() {
    if (allSubscribers.length === 0) { alert("لا توجد بيانات لتصديرها"); return; }

    let rows = '';
    allSubscribers.forEach((s, idx) => {
        rows += `
            <tr>
                <td style="border:1px solid #ccc; padding:8px;">${idx + 1}</td>
                <td style="border:1px solid #ccc; padding:8px;"><b>${s.name}</b></td>
                <td style="border:1px solid #ccc; padding:8px;">${s.ip}</td>
                <td style="border:1px solid #ccc; padding:8px;">${s.pass}</td>
                <td style="border:1px solid #ccc; padding:8px;">${s.phone}</td>
                <td style="border:1px solid #ccc; padding:8px;">${s.loc}</td>
            </tr>
        `;
    });

    const wordHTML = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>سجل مشتركين مجموعة الكرار</title></head>
        <body dir='rtl' style='font-family:Arial, sans-serif;'>
            <h2 style='text-align:center; color:#0284c7;'>مجموعة الكرار - تقرير سجل المشتركين</h2>
            <p style='text-align:center;'>تاريخ التقرير: ${new Date().toLocaleDateString('ar-IQ')}</p>
            <br>
            <table style='width:100%; border-collapse:collapse; text-align:right;'>
                <thead>
                    <tr style='background-color:#0284c7; color:#fff;'>
                        <th style='padding:10px;'>#</th>
                        <th style='padding:10px;'>الاسم</th>
                        <th style='padding:10px;'>IP</th>
                        <th style='padding:10px;'>الباسورد</th>
                        <th style='padding:10px;'>الهاتف</th>
                        <th style='padding:10px;'>الموقع</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </body>
        </html>
    `;

    const blob = new Blob(['\ufeff' + wordHTML], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `سجل_مشتركين_الكرار_${new Date().toISOString().slice(0,10)}.doc`;
    a.click();
}
</script>
</body>
</html>
